# Fork only (Allmight97/supcom-engine; never in an upstream PR): once a day, rewrite the issue
# "Upstream Mac watch" with the open upstream PRs that matter to the fork (mac/scripts/upstream-news).
name: Upstream Mac watch

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    if: github.repository == 'Allmight97/supcom-engine'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Upstream Mac watch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git remote add upstream https://github.com/bwiemz/supcom-engine.git
      - run: python3 mac/scripts/upstream-news --markdown > body.md
      - run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title \
                --jq "map(select(.title == env.TITLE))[0].number // empty")
          if [ -n "$n" ]; then gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md; fi
